name: PlatformIO Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Cache dependencies
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'm4/platformio.ini', 'm7/platformio.ini') }}

      # Setup Python environment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install PlatformIO Core
      - name: Install PlatformIO Core
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade platformio

      # Install package dependencies before generating variants
      - name: Install PlatformIO project packages
        run: |
          pio pkg install --project-dir m4
          pio pkg install --project-dir m7

      # Generate variants from the installed Arduino-mbed package
      - name: Regenerate PlatformIO variants
        run: |
          rm -rf platformio_variants/generated
          python3 platformio_tools/generate_platformio_variants.py
          test -f platformio_variants/generated/GIGA/pins_arduino.h
          test -f platformio_variants/generated/GENERIC_STM32H747_M4/pins_arduino.h

      # Build the complete firmware bundle through the root PlatformIO entrypoint
      - name: Build Firmware Bundle
        run: pio run -e gatekeeper_firmware

      # Rename firmware files
      - name: Rename Firmware Files
        run: |
          test -f ./.pio/build/gatekeeper_firmware/m4/gatekeeper_m4_usb_gateway/firmware.bin
          test -f ./.pio/build/gatekeeper_firmware/m7/gatekeeper_m7_worker/firmware.bin
          mkdir -p firmware
          cp ./.pio/build/gatekeeper_firmware/m4/gatekeeper_m4_usb_gateway/firmware.bin ./firmware/firmwareM4.bin
          cp ./.pio/build/gatekeeper_firmware/m7/gatekeeper_m7_worker/firmware.bin ./firmware/firmwareM7.bin

      # Package the firmware uploader with the newly built firmware
      - name: Package Firmware Uploader
        run: |
          mkdir -p release/firmware_uploader
          rsync -a --delete --exclude __pycache__ firmware_uploader/ release/firmware_uploader/
          mkdir -p release/firmware_uploader/firmware
          cp firmware/*.bin release/firmware_uploader/firmware/

      # Create a zip archive
      - name: Create Zip Archive
        run: |
          cd release
          zip -r ../Firmware_Package.zip firmware_uploader

      # Create GitHub Release
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Firmware Uploader Package v${{ github.run_number }}
          body: |
            This release includes the updated firmware files and firmware uploader package.
          draft: true
          prerelease: false
          files: Firmware_Package.zip
